# Local stack: the gateway, plus an optional ngrok tunnel that gives GitHub a
# public HTTPS URL to deliver webhooks to.
#
#   docker compose up --build              # gateway only
#   docker compose --profile tunnel up     # gateway + ngrok
#
# Secrets come from .env (git-ignored). Nothing is baked into the image.

services:
  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: issues-gateway:local
    container_name: issues-gateway
    env_file:
      - .env
    environment:
      # Container-internal overrides; everything else comes from .env.
      PORT: 8000
      LOG_FORMAT: json
      EVENT_STORE_PATH: /data/events.db
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      # Persist the webhook event store so dedupe survives a restart.
      - gateway-data:/data
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=4).status==200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

  # Public HTTPS URL for GitHub to deliver webhooks to, without opening a port
  # on your machine. Requires a free ngrok account:
  #
  #   1. Get an authtoken at https://dashboard.ngrok.com/get-started/your-authtoken
  #   2. Put it in .env as NGROK_AUTHTOKEN=...
  #   3. docker compose --profile tunnel up --build
  #   4. Read the public URL from the local inspector:
  #        curl -s http://localhost:4040/api/tunnels | python3 -c \
  #          "import json,sys; print(json.load(sys.stdin)['tunnels'][0]['public_url'])"
  #
  # Paste that URL + /webhook into the repository's webhook settings.
  # If you would rather run ngrok on the host, skip this profile and use
  #   ngrok http ${PORT:-8000}
  tunnel:
    image: ngrok/ngrok:latest
    container_name: issues-gateway-ngrok
    profiles: ["tunnel"]
    command: http gateway:8000 --log stdout
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN:?set NGROK_AUTHTOKEN in .env to use the tunnel profile}
    ports:
      # ngrok's local inspector: http://localhost:4040 shows every delivery,
      # including the ones GitHub sends, with full request and response bodies.
      - "4040:4040"
    depends_on:
      gateway:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gateway-data:
