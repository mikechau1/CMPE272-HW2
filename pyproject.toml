[project]
name = "issues-gateway"
version = "1.0.0"
description = "A 12-factor HTTP gateway over the GitHub Issues REST API, with webhook ingestion."
requires-python = ">=3.11"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "integration: hits the real GitHub API; requires GITHUB_TOKEN/OWNER/REPO (deselect with '-m \"not integration\"')",
    "tunnel: requires a public tunnel to /webhook (PUBLIC_WEBHOOK_URL)",
]

[tool.coverage.run]
source = ["app"]
branch = true
omit = ["app/__main__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S311", "E501"]
